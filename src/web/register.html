<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkeys</title>
<style>
:root { color-scheme: light dark; --fg:#111; --bg:#fafafa; --card:#fff; --line:#ddd; --muted:#666; --accent:#0b5fff; }
@media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --bg:#131313; --card:#1c1c1c; --line:#333; --muted:#999; --accent:#5b9bff; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); padding:32px 24px;
  font:15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
.card { width:100%; max-width:34rem; margin:0 auto; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:28px; }
h1 { margin:0; font-size:1.15rem; }
.head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px; }
.signout { color:var(--muted); font-size:.85rem; text-decoration:none; }
.signout:hover { color:var(--accent); text-decoration:underline; }
h2 { margin:26px 0 10px; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
button { padding:11px 14px; font:inherit; font-weight:600; border:0; border-radius:8px;
  background:var(--accent); color:#fff; cursor:pointer; }
button.danger { background:transparent; color:#c62828; border:1px solid var(--line); font-weight:500; padding:5px 10px; font-size:.82rem; }
input { width:100%; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); color:var(--fg); margin-bottom:10px; }
ul { list-style:none; margin:0; padding:0; }
li { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 0; border-bottom:1px solid var(--line); font-size:.92rem; }
li:last-child { border-bottom:0; }
li .when { color:var(--muted); font-size:.82rem; }
.empty { color:var(--muted); font-size:.9rem; padding:8px 0; }
.msg { margin-top:16px; padding:10px 12px; border-radius:8px; font-size:.88rem; display:none; }
.msg.err { display:block; background:rgba(200,40,40,.12); color:#c62828; }
.msg.ok  { display:block; background:rgba(20,150,70,.12); color:#1b8a4b; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>Passkeys</h1>
    <a class="signout" href="/logout">Sign out</a>
  </div>
  <p class="sub">Credentials that can sign in to this gate. This page is private: you are seeing it because you already authenticated.</p>

  <input id="label" placeholder="Name this passkey (e.g. MacBook Touch ID)" autocomplete="off">
  <button id="add">Add a passkey</button>
  <div class="msg" id="msg"></div>

  <h2>Enrolled passkeys</h2>
  <ul id="passkeys"></ul>

  <h2>Device tokens</h2>
  <ul id="devices"></ul>
</div>
<script src="/login/webauthn.js"></script>
<script>
const msg = document.getElementById("msg");
function show(kind, text) { msg.className = "msg " + kind; msg.textContent = text; }
function clear() { msg.className = "msg"; msg.textContent = ""; }
function when(secs) { return new Date(secs * 1000).toLocaleString(); }

async function refresh() {
  const data = await postJSON("/register/list", {});
  for (const [key, kind] of [["passkeys", "passkey"], ["devices", "device"]]) {
    const ul = document.getElementById(key);
    ul.innerHTML = "";
    if (!data[key].length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = key === "passkeys" ? "None yet." : "None issued.";
      ul.appendChild(li);
      continue;
    }
    for (const item of data[key]) {
      const li = document.createElement("li");
      const left = document.createElement("div");
      // textContent, not innerHTML: the label is whatever a human typed at
      // enrollment. Stripping <>& from it would probably be enough, but
      // "probably enough escaping" is how XSS happens; not parsing it as
      // markup at all is not a judgement call.
      const name = document.createElement("div");
      name.textContent = item.label;
      const added = document.createElement("div");
      added.className = "when";
      added.textContent = "added " + when(item.added);
      left.appendChild(name);
      left.appendChild(added);
      const btn = document.createElement("button");
      btn.className = "danger";
      btn.textContent = "Revoke";
      btn.onclick = async () => {
        if (!confirm("Revoke " + item.label + "?")) return;
        try {
          await postJSON("/register/revoke", { kind, label: item.label });
          show("ok", "Revoked " + item.label + ".");
          refresh();
        } catch (e) { show("err", e.message || String(e)); }
      };
      li.appendChild(left);
      li.appendChild(btn);
      ul.appendChild(li);
    }
  }
}

document.getElementById("add").addEventListener("click", async () => {
  clear();
  const label = document.getElementById("label").value.trim();
  if (!label) { show("err", "Give the passkey a name first."); return; }
  try {
    const start = await postJSON("/register/challenge", { label });
    const publicKey = decodeOptions(start.options.publicKey);
    const cred = await navigator.credentials.create({ publicKey });
    if (!cred) throw new Error("no credential returned");
    await postJSON("/register/verify", {
      ceremony: start.ceremony,
      label,
      credential: encodeCredential(cred),
    });
    show("ok", "Passkey added.");
    document.getElementById("label").value = "";
    refresh();
  } catch (e) {
    show("err", e.message || String(e));
  }
});

refresh().catch((e) => show("err", e.message || String(e)));
</script>
</body>
</html>
