[workspace]
members = [
    "crates/datalog-client",
    "crates/gatekeeper-abi",
    "crates/gatekeeper-fn",
    "crates/gatekeeper-fn-macro",
    "funcs/hello",
    "funcs/analytics",
    "funcs/polls",
    "funcs/nodescribe",
]

[package]
name = "gatekeeper"
version = "0.1.0"
edition = "2021"

[dependencies]
# Local fork: streaming bodies must flush each producer read so SSE events are
# observable immediately instead of waiting for tiny_http's 8 KiB chunk buffer.
tiny_http = { path = "crates/tiny-http", features = ["ssl-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
subtle = "2"
percent-encoding = "2"
signal-hook = "0.4.4"
libloading = "0.8"
gatekeeper-abi = { path = "crates/gatekeeper-abi" }
# Passkeys. webauthn-rs is pinned to the stable line (0.6 is a -dev release).
# This is the dependency cost the README's "not included: in-process ACME"
# paragraph was worried about; it is paid deliberately, for the human
# credential, and it brings no async runtime with it.
webauthn-rs = "0.5.5"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.11.0"
